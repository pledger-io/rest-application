name: Branch Build
on:
  push:

permissions:
  packages: write
  actions: read
  checks: write

jobs:
  check-software:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v7
     - name: Configure Java version
       uses: actions/setup-java@v6
       with:
         java-version: '25'
         distribution: 'temurin'
         architecture: x64
     - name: Prepare gradle installation
       uses: gradle/actions/setup-gradle@v6
     - name: Build the application
       run: ./gradlew classes -q
     - name: Verify the software
       run: ./gradlew check -x classes -q
     - name: Publish Test Results
       uses: EnricoMi/publish-unit-test-result-action@v2
       if: (!cancelled())
       with:
         files: |
            build/test-results/**/*.xml

     - name: Quality gate
       run: ./gradlew sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.gradle.skipCompile=true -Dsonar.host.url=https://sonarcloud.io
       if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

     - name: Publish snapshot artifacts
       run: |
         SNAPSHOT_VERSION=$(./gradlew cV -q -Prelease.quiet)
         echo "Snapshot version: $SNAPSHOT_VERSION"
         ./gradlew jar -x classes -Pversion=${SNAPSHOT_VERSION}
         ./gradlew -Pversion=${SNAPSHOT_VERSION} publish -x jar
       if: github.ref == 'refs/heads/master'
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
